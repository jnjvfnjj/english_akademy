spring.application.name=english-school-crm

server.port=8080
server.address=0.0.0.0

# Set the standard SPRING_DATASOURCE_* variables or the legacy DATABASE_*
# variables to use a managed database. Local runs use H2.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:file:./data/english_school_crm;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USER:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.h2.console.enabled=false
app.admin-registration-code=${ADMIN_REGISTRATION_CODE:}
