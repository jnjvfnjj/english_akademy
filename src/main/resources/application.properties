spring.application.name=english-school-crm

server.port=8080
server.address=0.0.0.0

# Set DATABASE_URL, DATABASE_USER, and DATABASE_PASSWORD to use the same
# managed PostgreSQL database from every deployed API instance. Local runs
# use a persistent H2 file instead of an in-memory database.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/english_school_crm;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driverClassName=${DATABASE_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DATABASE_DIALECT:org.hibernate.dialect.H2Dialect}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.h2.console.enabled=false
